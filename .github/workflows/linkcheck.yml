name: Check URL Status

on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * 0 # run at midnight every Sunday

env:
  LINK_TRACKING_ISSUE_NUMBER: 85

permissions:
  issues: write

jobs:
  check-urls:
    if: ${{ !github.event.repository.fork }}
    env:
      LYCHEE_REPORT_FILE: ./lychee/out.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # v2 fails the step on broken links by default; keep going so the
          # tracking issue gets updated below.
          fail: false

      - name: Read Lychee report
        if: steps.lychee.outputs.exit_code != 0
        id: readReport
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "FILE_CONTENT<<$EOF" >> $GITHUB_OUTPUT
          echo "$(cat ${{ env.LYCHEE_REPORT_FILE }})" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
      - run: echo "${{ steps.readReport.outputs.FILE_CONTENT }}"
      - name: Update link tracking issue (update invalid links)
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ steps.readReport.outputs.FILE_CONTENT }}
        run: |
          gh api --method PATCH "repos/${{ github.repository }}/issues/${LINK_TRACKING_ISSUE_NUMBER}" \
            -f state=open \
            -f body="${ISSUE_BODY}"

      - name: Update link tracking issue (no invalid links)
        if: steps.lychee.outputs.exit_code == 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH "repos/${{ github.repository }}/issues/${LINK_TRACKING_ISSUE_NUMBER}" \
            -f state=closed \
            -f body='No invalid links found! 🤖'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lychee-report
          path: ${{ env.LYCHEE_REPORT_FILE }}
